name: Build & release APK

# Every push to main: run the engine tests, build the signed release APK and
# publish it as GitHub Release v1.0.<run number>. The app's updater polls
# releases/latest, so a green build reaches the phone automatically.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/train.yml'
      - '.github/workflows/quickwins.yml'
      - 'trainer/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test engine and build release APK
        run: |
          set -o pipefail
          ./gradlew :engine:test :app:testReleaseUnitTest :app:assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="1.0.${{ github.run_number }}"
          APK="StockAnalyzer-$V.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          NOTES="$(git log -1 --pretty=%B | head -c 1500)"
          gh release create "v$V" "$APK" --title "StockAnalyzer $V" --notes "$NOTES" --target "${GITHUB_SHA}"

      - name: Publish build log to the ci-build branch
        if: always()
        run: |
          mkdir -p /tmp/pub
          cp build.log /tmp/pub/ 2>/dev/null || true
          for f in engine/build/test-results/test/*.xml app/build/test-results/testReleaseUnitTest/*.xml; do [ -f "$f" ] && cp "$f" /tmp/pub/; done
          echo "${GITHUB_SHA} ${{ job.status }} run ${{ github.run_number }} $(date -u +%FT%TZ)" > /tmp/pub/STATUS
          cd /tmp/pub
          git init -q
          git checkout -q -b ci-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-build
