name: Quick wins scan

# Every 15 minutes on weekdays while Oslo or New York is open: finds today's +3% movers and
# publishes quickwins.json on the `quickwins` branch. The app downloads that one small file
# (instead of scanning 150+ charts on the phone) to alert you about quick wins.
on:
  schedule:
    - cron: '*/15 7-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quickwins
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build scanner
        run: ./gradlew :trainer:installDist --no-daemon -q
      - name: Scan
        run: trainer/build/install/trainer/bin/trainer --quickscan --out out
      - name: Publish
        run: |
          cd out
          git init -q -b quickwins
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quickwins.json
          git commit -qm "Quick wins $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" quickwins
